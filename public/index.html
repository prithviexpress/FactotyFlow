<div id="stage">
  <header id="hdr"></header>
  <div id="alertbar"></div>
  <section id="kpis"></section>
  <nav id="tabs"></nav>
  <section id="main">
    <div class="panel" id="p-map">
      <div class="ptitle"><h2>PLANT LAYOUT &amp; MATERIAL BUFFERS</h2>
        <a class="more" data-href="#/inventory">Inventory hours &rsaquo;</a><div class="legend" id="map-legend"></div></div>
      <svg id="map" viewBox="0 0 1152 384" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#29b6ff"/></marker>
          <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22e07a"/></marker>
          <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffc83d"/></marker>
          <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff4d4d"/></marker>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path id="map-grid" d="M24 0H0V24" fill="none" stroke-width=".6"/></pattern>
        </defs>
        <rect id="map-bg" width="1152" height="384"/>
        <rect width="1152" height="384" fill="url(#grid)"/>
        <g id="roads"></g>
        <g id="flows"></g>
        <g id="nodes"></g>
      </svg>
    </div>
    <div class="panel risk" id="p-risk"></div>
  </section>
  <section id="rowA">
    <div class="panel" id="p-inbound"></div>
    <div class="panel" id="p-transfers"></div>
    <div class="panel" id="p-lineside"></div>
  </section>
  <section id="rowB">
    <div class="panel" id="p-quality"></div>
    <div class="panel" id="p-amr"></div>
  </section>
  <section id="page"></section>
  <footer id="foot"></footer>
</div>

<div id="tip" hidden></div>

<script src="sim.js"></script>
<script src="pages.js"></script>
<script src="settings.js"></script>
<script src="datapoints.js"></script>
<script src="app.js"></script>
</body>
</html>
